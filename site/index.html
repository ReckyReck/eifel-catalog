<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eifel Mastering Central - catalog</title>
<style>
  :root { --bg: #1b1b1c; --panel: #262627; --line: #39393a; --ink: #d8d4cb; --dim: #9a968d; --amber: #f3a23e; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 Inter, system-ui, -apple-system, sans-serif; }
  main { max-width: 1180px; margin: 0 auto; padding: 32px 24px 48px; }
  h1 { font-weight: 300; margin: 0; font-size: 28px; } h1 b { font-weight: 700; }
  .sub { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); margin: 2px 0 18px; }
  .bar { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; margin-bottom: 14px; color: var(--dim); }
  .bar .count { color: var(--ink); font-weight: 600; }
  .bar input, .bar select { background: #111; color: var(--ink); border: 1px solid var(--line); border-radius: 6px;
                            padding: 6px 9px; font: inherit; }
  .bar input { width: 220px; }
  .bar .links { margin-left: auto; }
  a { color: var(--amber); text-decoration: none; } a:hover { text-decoration: underline; }
  table { width: 100%; border-collapse: collapse; background: var(--panel); border-radius: 10px; overflow: hidden; }
  th { text-align: left; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--dim);
       font-weight: 600; padding: 10px 12px; border-bottom: 1px solid var(--line); background: #2d2d2e; }
  td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
  tr:last-child td { border-bottom: 0; }
  td.pic { width: 156px; padding-right: 4px; }
  td.pic img { width: 150px; height: 60px; object-fit: cover; border-radius: 4px; display: block; background: #111; }
  .name { font-weight: 700; font-size: 15px; }
  .tag { color: var(--dim); font-size: 12.5px; margin-top: 2px; }
  .ver { font: 600 14px/1.2 ui-monospace, Menlo, Consolas, monospace; color: var(--amber); white-space: nowrap; }
  .date, .cat { white-space: nowrap; }
  .new { display: inline-block; margin-left: 6px; font-size: 10px; letter-spacing: .08em; text-transform: uppercase;
         color: #111; background: var(--amber); border-radius: 3px; padding: 0 5px; vertical-align: 2px; }
  .fmt { color: var(--dim); font-size: 12.5px; white-space: nowrap; }
  ul.log { margin: 0; padding-left: 16px; color: var(--dim); font-size: 12.5px; }
  .msg { background: var(--panel); border-radius: 10px; padding: 24px; color: var(--dim); }
  footer { margin-top: 16px; color: var(--dim); font-size: 12px; }
  @media (max-width: 820px) { td.pic, th.pic, td.log, th.log { display: none; } .bar .links { margin-left: 0; } }
</style>
</head>
<body>
<main>
  <h1>Eifel Mastering <b>CENTRAL</b></h1>
  <div class="sub">Plug-in catalog</div>

  <div class="bar">
    <span><span class="count" id="count">-</span> plug-ins</span>
    <input id="q" type="search" placeholder="Search name, category ..." aria-label="Search">
    <label>Sort <select id="sort">
      <option value="name">by name</option>
      <option value="date">newest release first</option>
      <option value="cat">by category</option>
    </select></label>
    <span class="links"><a href="catalog.json">catalog.json</a> &middot;
      <a href="https://github.com/ReckyReck/eifel-catalog/releases">all releases</a></span>
  </div>

  <div id="out"><div class="msg">Loading the catalog ...</div></div>
  <footer id="foot"></footer>
</main>

<script>
// Lists what Eifel Mastering Central offers right now: it reads catalog.json (the same file the app reads),
// so it is up to date after every "Build catalog" run - nothing to edit here when a plug-in is released.
(function () {
  "use strict";
  var data = [];
  var out = document.getElementById("out"), q = document.getElementById("q"), sort = document.getElementById("sort");

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function fmtDate(iso) {
    if (!iso) return "";
    var d = new Date(iso + "T12:00:00Z");
    return isNaN(d) ? iso : d.toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" });
  }
  function formats(p) {
    var f = p.formats || {}, parts = [];
    if (f.macos && f.macos.length) parts.push("Mac " + f.macos.map(function (x) { return x.toUpperCase(); }).join(" / "));
    if (f.windows && f.windows.length) parts.push("Windows " + f.windows.map(function (x) { return x.toUpperCase(); }).join(" / "));
    return parts.join("<br>");
  }
  function changelog(p) {
    var c = (p.latest && p.latest.changelog) || [];
    if (typeof c === "string") c = c.split(/\n+/);
    c = c.map(function (l) { return String(l).replace(/^\s*-\s*/, ""); }).filter(Boolean).slice(0, 3);
    return c.length ? "<ul class=\"log\">" + c.map(function (l) { return "<li>" + esc(l) + "</li>"; }).join("") + "</ul>" : "";
  }
  function isNew(iso) {
    var d = new Date(iso + "T12:00:00Z");
    return !isNaN(d) && (Date.now() - d.getTime()) < 2 * 864e5;   // "new" = released in the last two days
  }

  function render() {
    var term = q.value.trim().toLowerCase();
    var rows = data.filter(function (p) {
      return !term || [p.name, p.tagline, p.category, p.id].some(function (s) { return String(s || "").toLowerCase().indexOf(term) >= 0; });
    });
    var by = sort.value;
    rows.sort(function (a, b) {
      var an = a.name || "", bn = b.name || "";
      if (by === "date") return ((b.latest || {}).releasedAt || "").localeCompare((a.latest || {}).releasedAt || "") || an.localeCompare(bn);
      if (by === "cat") return (a.category || "").localeCompare(b.category || "") || an.localeCompare(bn);
      return an.localeCompare(bn);
    });
    document.getElementById("count").textContent = data.length;
    if (!rows.length) { out.innerHTML = "<div class=\"msg\">No plug-in matches \"" + esc(q.value) + "\".</div>"; return; }
    out.innerHTML = "<table><thead><tr><th class=\"pic\"></th><th>Plug-in</th><th>Version</th><th>Released</th>" +
      "<th>Category</th><th>Formats</th><th class=\"log\">What's new</th></tr></thead><tbody>" +
      rows.map(function (p) {
        var l = p.latest || {};
        var img = p.image || ("plugins/" + p.id + "/faceplate.png");
        return "<tr>" +
          "<td class=\"pic\"><img src=\"" + esc(img) + "\" alt=\"\" loading=\"lazy\" onerror=\"this.style.visibility='hidden'\"></td>" +
          "<td><div class=\"name\">" + esc(p.name) + "</div><div class=\"tag\">" + esc(p.tagline) + "</div></td>" +
          "<td class=\"ver\">" + esc(l.version) + "</td>" +
          "<td class=\"date\">" + esc(fmtDate(l.releasedAt)) + (isNew(l.releasedAt) ? "<span class=\"new\">new</span>" : "") + "</td>" +
          "<td class=\"cat\">" + esc(p.category) + "</td>" +
          "<td class=\"fmt\">" + formats(p) + "</td>" +
          "<td class=\"log\">" + changelog(p) + "</td></tr>";
      }).join("") + "</tbody></table>";
  }

  fetch("catalog.json", { cache: "no-store" })
    .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(function (c) {
      data = c.plugins || [];
      if (c.generatedAt) {
        var g = new Date(c.generatedAt);
        document.getElementById("foot").textContent = "Catalog built " +
          (isNaN(g) ? c.generatedAt : g.toLocaleString("en-GB", { dateStyle: "medium", timeStyle: "short" })) +
          ". This list updates itself after every release.";
      }
      render();
    })
    .catch(function (e) {
      out.innerHTML = "<div class=\"msg\">The catalog could not be loaded (" + esc(e.message) +
        "). The raw list is at <a href=\"catalog.json\">catalog.json</a>.</div>";
    });
  q.addEventListener("input", render);
  sort.addEventListener("change", render);
})();
</script>
</body>
</html>
